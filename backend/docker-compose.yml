version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ubsl_admin
      POSTGRES_PASSWORD: ubsl_password
      POSTGRES_DB: ubsl_inventory
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
